{% extends 'allocator/base.html' %}

{% block title %}Sign In &bull; SmartAlloc{% endblock %}

{% block content %}
<div class="row justify-content-center pt-4">
    <div class="col-md-5 col-lg-4">
        <div class="card p-4">
            <div class="text-center mb-4">
                <span class="d-inline-block bg-dark text-white rounded px-2 py-1 fw-bold mb-2" style="font-size: 0.85rem;">SA</span>
                <h4 class="fw-bold mb-1 tracking-tight">Sign In</h4>
                <p class="text-muted small mb-0">Access your personal task workbench</p>
            </div>

            <form method="POST">
                {% csrf_token %}

                {% if form.non_field_errors %}
                    <div class="alert alert-danger py-2 small mb-3">
                        {% for error in form.non_field_errors %}
                            <div>{{ error }}</div>
                        {% endfor %}
                    </div>
                {% endif %}

                <div class="mb-3">
                    <label for="id_username" class="form-label small fw-semibold text-uppercase tracking-wider text-muted">Username</label>
                    <input type="text" name="username" autofocus required class="form-control" id="id_username" placeholder="Username">
                </div>

                <div class="mb-4">
                    <label for="id_password" class="form-label small fw-semibold text-uppercase tracking-wider text-muted">Password</label>
                    <input type="password" name="password" required class="form-control" id="id_password" placeholder="Password">
                </div>

                <button type="submit" class="btn btn-dark w-100 py-2 mb-3">Sign In</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
